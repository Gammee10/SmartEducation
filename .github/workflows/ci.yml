name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! npm ci --no-audit --no-fund 2>&1 | tee /tmp/npmci.log; then
            tail -8 /tmp/npmci.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:backend
      - name: Build
        run: npm run build
