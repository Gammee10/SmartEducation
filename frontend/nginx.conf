# SPA + API reverse proxy (M14). The app calls same-origin /api, so no CORS
# configuration is needed when frontend and backend deploy together. The
# `backend` host matches the compose/service name - override for your
# platform (e.g. Render rewrites or an env-templated conf).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
